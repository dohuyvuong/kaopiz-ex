services:
  backend:
    image: ${BACKEND_IMAGE}
    hostname: ${BACKEND_HOST}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${BACKEND_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      APP_URL: ${APP_URL}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI}
      AZURE_SCOPE: ${AZURE_SCOPE}
      AZURE_AUTHORITY: ${AZURE_AUTHORITY}
      KSYSTEM_API_BASE_URL: ${KSYSTEM_API_BASE_URL}
      KSYSTEM_SOCIAL_LOGIN_ENDPOINT: ${KSYSTEM_SOCIAL_LOGIN_ENDPOINT}
      KSYSTEM_OAUTH_BASE_URL: ${KSYSTEM_OAUTH_BASE_URL}
      KSYSTEM_OAUTH_CLIENT_ID: ${KSYSTEM_OAUTH_CLIENT_ID}
      KSYSTEM_OAUTH_REDIRECT_URI: ${KSYSTEM_OAUTH_REDIRECT_URI}
      HRM_API_BASE_URL: ${HRM_API_BASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

  frontend:
    image: ${FRONTEND_IMAGE}
    hostname: ${FRONTEND_HOST}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - certbot-etc:/etc/letsencrypt
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      CERTBOT_STAGING: ${CERTBOT_STAGING}
      FRONTEND_HOST: ${FRONTEND_HOST}
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "80:80"
      - "443:443"

  keep-alive:
    image: alpine:3.23
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN}
    restart: always
    entrypoint: >
      /bin/sh -c "
        if [ -z \"$$PRIMARY_DOMAIN\" ]; then
          echo 'PRIMARY_DOMAIN is empty. Exiting.';
          exit 1;
        fi;
        url=\"https://$$PRIMARY_DOMAIN\";
        interval=60;
        while true; do
          start=$$(date +%s);
          wget -q -T 15 -O /dev/null \"$$url\" || true;
          echo \"Ping sent to $$url at $$(date)\";
          end=$$(date +%s);
          elapsed=$$((end - start));
          sleep_for=$$((interval - elapsed));
          if [ $$sleep_for -lt 0 ]; then sleep_for=0; fi;
          sleep $$sleep_for;
        done"
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 20M

volumes:
  certbot-etc:
